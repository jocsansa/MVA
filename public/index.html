<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WING Remote</title>
<style>
  :root { --bg:#121417; --panel:#1c1f24; --line:#2c3138; --text:#e6e8eb; --muted:#8b939e;
          --green:#3fb950; --yellow:#d29922; --red:#f85149; --mute:#b62324; --solo:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; background:var(--panel); border:1px solid var(--line); }
  .ok { color:var(--green); } .err { color:var(--red); }
  .ro { color:var(--yellow); }
  .badge.rw { color:var(--red); border-color:var(--red); }
  nav { display:flex; gap:4px; padding:12px 16px 0; flex-wrap:wrap; }
  nav button { font:inherit; padding:6px 12px; color:var(--muted); background:transparent; border:1px solid var(--line);
    border-radius:6px; cursor:pointer; }
  nav button.active { color:var(--text); background:var(--panel); border-color:var(--text); }
  nav .count { font-size:11px; color:var(--muted); margin-left:4px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(124px, 1fr)); gap:8px; padding:16px; }
  .ch { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; padding-top:12px;
    display:flex; flex-direction:column; gap:6px; overflow:hidden; }
  .ch.muted { border-color:var(--mute); }
  .colbar { position:absolute; top:0; left:0; right:0; height:5px; border:0; padding:0; background:var(--line); }
  body.writable .colbar { cursor:pointer; }
  body.writable .colbar:hover { height:8px; }
  .num { color:var(--muted); font-size:11px; }
  .name { width:100%; margin:0 -4px; padding:1px 4px; font:inherit; font-weight:600; color:var(--text);
    background:transparent; border:1px solid transparent; border-radius:3px; text-overflow:ellipsis; }
  .name::placeholder { color:var(--muted); font-weight:400; font-style:italic; }
  .name:read-only { cursor:default; }
  body.writable .name:not(:read-only):hover { border-color:var(--line); }
  body.writable .name:focus { outline:none; border-color:var(--text); background:#0b0c0e; }
  .meter { height:90px; display:flex; gap:3px; align-items:flex-end; background:#0b0c0e; border-radius:3px; padding:2px; }
  .bar { flex:1; background:linear-gradient(to top, var(--green) 0 70%, var(--yellow) 70% 88%, var(--red) 88%); border-radius:2px;
         clip-path: inset(calc(100% - var(--h, 0%)) 0 0 0); height:100%; transition: clip-path 60ms linear; }
  .btns { display:flex; gap:4px; }
  .tag { flex:1; font:inherit; font-size:11px; font-weight:700; text-align:center; border-radius:3px; padding:1px;
    border:1px solid var(--line); background:transparent; color:var(--muted); }
  .tag:disabled { cursor:default; }
  .tag.on.mute-tag { background:var(--mute); border-color:var(--mute); color:#fff; }
  .tag.on.solo-tag { background:var(--solo); border-color:var(--solo); color:#111; }
  .solo-tag { flex:0 0 26px; }
  body.writable .tag:not(:disabled) { cursor:pointer; }
  body.writable .tag:not(:disabled):hover { filter:brightness(1.3); border-color:var(--text); }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
  .row > span:first-child { color:var(--muted); }
  .val { display:flex; align-items:center; gap:3px; }
  .num-in { width:4.2em; padding:0 3px; font:inherit; color:var(--text); text-align:right; background:transparent;
    border:1px solid transparent; border-radius:3px; }
  .num-in:read-only { cursor:default; }
  body.writable .num-in:not(:read-only):hover { border-color:var(--line); }
  body.writable .num-in:focus { outline:none; border-color:var(--text); background:#0b0c0e; }
  #ro-note { display:none; margin:12px 16px 0; padding:8px 12px; border:1px solid var(--yellow); border-radius:6px;
    color:var(--yellow); font-size:13px; }
  body:not(.writable) #ro-note { display:block; }
  #ro-note code { color:var(--text); }
  #dlg { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:10; }
  #dlg.open { display:flex; }
  #dlg .box { width:min(440px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:16px; display:flex; flex-direction:column; gap:12px; }
  #dlg h2 { margin:0; font-size:16px; }
  #dlg .cmd { font-family:ui-monospace, Menlo, monospace; font-size:13px; background:#0b0c0e; padding:8px; border-radius:4px;
    overflow-wrap:anywhere; }
  #dlg .err { font-size:13px; min-height:1em; }
  #dlg .note { font-size:13px; color:var(--yellow); }
  #dlg .note:empty, #dlg .extra:empty { display:none; }
  #dlg .btns { justify-content:flex-end; gap:8px; }
  #dlg .btns button { font:inherit; padding:6px 14px; border-radius:4px; border:1px solid var(--line); background:#262a31; color:var(--text); cursor:pointer; }
  #dlg button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  #dlg button:disabled { opacity:.5; cursor:default; }
  .swatches { display:grid; grid-template-columns:repeat(9, 1fr); gap:6px; }
  .swatches button { aspect-ratio:1; border-radius:4px; border:2px solid transparent; cursor:pointer; font-size:10px; color:#111; }
  .swatches button.sel { border-color:var(--text); }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); max-width:calc(100vw - 32px); padding:8px 14px;
    border-radius:6px; background:var(--panel); border:1px solid var(--line); display:none; z-index:11; }
  #toast.show { display:block; }
  #dlg .cmd { white-space:pre-wrap; }
  .eq-tag { flex:0 0 32px; cursor:pointer; }
  .eq-tag:hover { border-color:var(--text); color:var(--text); }

  /* ---------- painel de EQ: escuro de alto contraste, cor da WING como identidade do canal,
     alvos de toque grandes (48px ou mais) ---------- */
  #eq { --ink:#fff; --ink2:#c8ced6; --bg0:#000; --bg1:#0c0e11; --bg2:#181b20; --edge:#4a525e; --go:#ffd400;
    --cc:#6b7c93; --cc-ink:#fff; padding:12px 16px 104px; color:var(--ink); color-scheme:dark; }
  #eq[hidden], #grid[hidden] { display:none; }
  body.eq-mode { background:#000; }
  .big { min-height:48px; min-width:48px; padding:0 16px; font:inherit; font-size:16px; font-weight:700; color:var(--ink);
    background:var(--bg2); border:2px solid var(--edge); border-radius:10px; cursor:pointer; touch-action:manipulation; }
  .big:disabled { opacity:.4; cursor:default; }
  .big:focus-visible { outline:3px solid var(--go); outline-offset:2px; }
  .big.ghost { background:transparent; }
  .big.toggle.on { background:var(--cc); border-color:var(--cc); color:var(--cc-ink); }
  .eq-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; }
  .chip { flex:0 0 auto; position:relative; min-width:84px; min-height:56px; padding:6px 10px 6px 16px; text-align:left;
    font-size:14px; line-height:1.2; }
  .chip::before { content:""; position:absolute; left:0; top:0; bottom:0; width:7px; background:var(--chip); border-radius:8px 0 0 8px; }
  .chip b { display:block; font-size:12px; color:var(--ink2); }
  .chip span { display:block; max-width:9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip.sel { background:var(--chip); border-color:#fff; color:var(--chip-ink); }
  .chip.sel b { color:inherit; }
  .eq-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:8px 0 12px;
    padding:10px 14px; background:var(--bg1); border:2px solid var(--edge); border-left:12px solid var(--cc); border-radius:12px; }
  .eq-id { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; min-width:0; }
  .eq-chnum { font-size:22px; font-weight:800; }
  .eq-chname { font-size:22px; font-weight:600; color:var(--ink2); overflow-wrap:anywhere; }
  .eq-model { font-size:12px; font-weight:700; padding:2px 8px; border:1px solid var(--edge); border-radius:6px; color:var(--ink2); }
  .eq-model:empty { display:none; }
  .eq-headbtns { display:flex; gap:8px; }
  .eq-msg { margin:0 0 12px; padding:10px 14px; border:2px solid var(--go); border-radius:10px; color:var(--go); font-weight:600; }
  .eq-msg:empty { display:none; }
  .eq-msg.err { border-color:var(--red); color:#ff7b72; }
  .eq-graph-wrap { background:var(--bg0); border:2px solid var(--edge); border-radius:12px; overflow:hidden; }
  #eq-graph { display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  #eq-graph .g { stroke:#1c2026; stroke-width:1; }
  #eq-graph .g-major { stroke:#343c47; }
  #eq-graph .gl { fill:#9aa3ad; font-size:11px; }
  #eq-graph .c-fill { fill-opacity:.28; }
  #eq-graph .c-main { fill:none; stroke:#fff; stroke-width:3; }
  #eq-graph .c-old { fill:none; stroke:#9aa3ad; stroke-width:2; stroke-dasharray:6 5; }
  #eq-graph .c-band { fill:none; stroke-width:2; }
  #eq-graph .h circle { stroke:#000; stroke-width:2; }
  #eq-graph .h .ring { fill:none; stroke:#fff; stroke-width:3; }
  #eq-graph .h.dim { opacity:.45; }
  #eq-graph text.hl { font-size:13px; font-weight:800; text-anchor:middle; fill:#000; pointer-events:none; }
  #eq-graph .h-flt rect { fill:#fff; stroke:#000; stroke-width:2; }
  #eq-graph .h-flt.off rect { fill:#000; stroke:#9aa3ad; }
  #eq-graph .h-flt.off text.hl { fill:#9aa3ad; }
  .eq-bands { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:8px; margin:12px 0; }
  .band { position:relative; min-height:64px; padding:6px 4px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; border-top:7px solid var(--bc); }
  .band small { font-size:12px; font-weight:600; color:var(--ink2); white-space:nowrap; }
  .band.sel { background:var(--bc); border-color:var(--bc); color:#000; }
  .band.sel small { color:#000; }
  .band.changed::after, .eq-card h3.changed::after { content:""; position:absolute; top:6px; right:6px; width:10px; height:10px;
    border-radius:50%; background:var(--go); box-shadow:0 0 0 2px #000; }
  .eq-lower { display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 1fr)); gap:12px; }
  .eq-card { background:var(--bg1); border:2px solid var(--edge); border-radius:12px; padding:12px; display:flex;
    flex-direction:column; gap:10px; }
  .eq-card h3 { position:relative; margin:0; min-height:48px; font-size:17px; display:flex; align-items:center;
    justify-content:space-between; gap:8px; padding-right:16px; }
  .eq-card.band-card { border-top:7px solid var(--bc); }
  .stp { display:grid; grid-template-columns:5.2em 52px minmax(0, 1fr) 52px; gap:6px; align-items:center; }
  .stp-l { font-weight:600; color:var(--ink2); }
  .stp .big { padding:0; font-size:22px; }
  .stp-v { min-width:0; min-height:52px; text-align:center; font:inherit; font-size:18px; font-weight:700; color:var(--ink);
    background:var(--bg0); border:2px solid var(--edge); border-radius:10px; }
  .stp-v:focus { outline:none; border-color:var(--go); }
  .stp-v:read-only { color:var(--ink2); }
  .stp.changed .stp-v, .seg.changed .big.on { border-color:var(--go); box-shadow:0 0 0 2px var(--go); }
  .seg { display:flex; gap:6px; }
  .seg .big { flex:1; padding:0 8px; }
  .seg .big.on { background:#fff; border-color:#fff; color:#000; }
  .eq-risk { margin:0; color:var(--go); font-size:14px; font-weight:600; }
  .eq-risk:empty { display:none; }
  .eq-status { position:fixed; left:0; right:0; bottom:0; display:none; flex-direction:column; gap:4px; padding:10px 16px;
    background:#000; border-top:3px solid var(--go); z-index:5; }
  .eq-status.show { display:flex; }
  .eq-status.ok { border-top-color:var(--green); }
  .eq-status.err { border-top-color:var(--red); }
  .eq-status-main { font-weight:700; }
  .eq-status.err .eq-status-main { color:#ff7b72; }
  .eq-status-cmd { font-family:ui-monospace, Menlo, monospace; font-size:13px; color:var(--ink2); white-space:pre-wrap;
    overflow-wrap:anywhere; }
  .eq-status-risk { color:var(--go); font-size:14px; font-weight:600; }
  .eq-status-cmd:empty, .eq-status-risk:empty { display:none; }
  @media (max-width:560px) {
    .eq-bands { grid-template-columns:repeat(3, minmax(0, 1fr)); }
    .stp { grid-template-columns:5.6em 48px minmax(0, 1fr) 48px; }
    .stp-l { font-size:14px; }
    .eq-chnum, .eq-chname { font-size:18px; }
  }
</style>
</head>
<body>
<header>
  <h1>WING Remote</h1>
  <span class="badge" id="host">—</span>
  <span class="badge" id="osc">OSC: —</span>
  <span class="badge" id="mtr">Medidores: —</span>
  <span class="badge ro" id="mode">Somente leitura</span>
  <span id="info" class="num"></span>
</header>
<div id="ro-note">Somente leitura: para mudar valores pela página, inicie com
  <code>CONSOLE_HOST=&lt;ip&gt; WING_ALLOW_WRITES=1 npm start</code></div>
<nav id="tabs"></nav>
<div id="grid"></div>
<section id="eq" hidden aria-label="EQ do canal">
  <div class="eq-chips" id="eq-chips" aria-label="Escolher canal"></div>
  <div class="eq-head">
    <div class="eq-id"><span class="eq-chnum" id="eq-chnum"></span><span class="eq-chname" id="eq-chname"></span>
      <span class="eq-model" id="eq-model"></span></div>
    <div class="eq-headbtns">
      <button type="button" class="big toggle" id="eq-on">EQ</button>
      <button type="button" class="big ghost" id="eq-reload" title="Ler de novo da mesa">Reler</button>
    </div>
  </div>
  <div class="eq-msg" id="eq-msg"></div>
  <div class="eq-graph-wrap" id="eq-graph-wrap"><svg id="eq-graph" role="img" aria-label="Curva de EQ e filtros"></svg></div>
  <div class="eq-bands" id="eq-bands"></div>
  <div class="eq-lower">
    <div class="eq-card band-card" id="eq-band-card"></div>
    <div class="eq-card" id="eq-hpf"></div>
    <div class="eq-card" id="eq-lpf"></div>
  </div>
  <div class="eq-status" id="eq-status" role="status" aria-live="polite">
    <div class="eq-status-main" id="eq-status-main"></div>
    <div class="eq-status-cmd" id="eq-status-cmd"></div>
    <div class="eq-status-risk" id="eq-status-risk"></div>
  </div>
</section>
<div id="dlg" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="dlg-title"></h2>
    <div class="extra" id="dlg-extra"></div>
    <div>Comando que será enviado à mesa:</div>
    <div class="cmd" id="dlg-cmd"></div>
    <div class="note" id="dlg-note"></div>
    <div class="err" id="dlg-err"></div>
    <div class="btns">
      <button type="button" id="dlg-cancel">Cancelar</button>
      <button type="button" class="primary" id="dlg-ok">Enviar</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
  // Cores 1..18 da WING. Tons aproximados (a documentação não traz os valores RGB).
  const COLORS = ["#6b7c93", "#3d6fd1", "#1f3f9e", "#2bb3c0", "#2f9e44", "#7a9a2f", "#e3c02b", "#e8862b", "#d63a3a",
    "#e86a5a", "#e35d9c", "#9b59b6", "#5b4bb7", "#a0a0a0", "#ffffff", "#8b5a2b", "#c0a080", "#404040"];
  const PREFIX = { ch: "CH", aux: "AUX", bus: "BUS", main: "MAIN", mtx: "MTX", dca: "DCA", mgrp: "MGRP" };

  let kinds = [];
  let strips = {};
  let lastStatus = null;
  let active = "ch";
  try { active = localStorage.getItem("wing-tab") || "ch"; } catch {}
  const grid = document.getElementById("grid");
  const cards = {}; // "ch/1" -> elementos

  // ---------- formatação e leitura de valores digitados ----------
  const pct = (db) => db == null ? 0 : Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
  const fmtNum = (v) => v == null ? "—" : v <= -144 ? "-∞" : v.toFixed(1);
  const fmtDb = (v) => (v <= -144 ? "-∞" : (v > 0 ? "+" : "") + v.toFixed(1)) + " dB";
  const fmtPan = (v) => v == null ? "—" : Math.round(v) === 0 ? "C" : (v < 0 ? "L" : "R") + Math.abs(Math.round(v));
  function parseDb(text) {
    const t = text.trim().toLowerCase().replace(",", ".").replace(/\s*db$/, "");
    if (["-∞", "-inf", "-oo", "-infinito"].includes(t)) return -144;
    if (!/^[+-]?\d+(\.\d+)?$/.test(t)) return NaN;
    return Math.round(Number(t) * 10) / 10;
  }
  // "L30" -> -30, "R20" -> 20, "C" -> 0, "-15" -> -15
  function parsePan(text) {
    const t = text.trim().toUpperCase().replace(",", ".");
    if (t === "C" || t === "0") return 0;
    const m = /^([LR])\s*(\d+)$/.exec(t);
    if (m) return (m[1] === "L" ? -1 : 1) * Number(m[2]);
    if (/^[+-]?\d+$/.test(t)) return Number(t);
    return NaN;
  }

  // ---------- janela de confirmação ----------
  const dlg = {
    root: document.getElementById("dlg"), title: document.getElementById("dlg-title"),
    extra: document.getElementById("dlg-extra"), cmd: document.getElementById("dlg-cmd"),
    note: document.getElementById("dlg-note"), err: document.getElementById("dlg-err"),
    ok: document.getElementById("dlg-ok"), cancel: document.getElementById("dlg-cancel"), action: null, onCancel: null,
  };
  function openDialog({ title, cmd, error, note, extra, send, onCancel }) {
    dlg.title.textContent = title;
    dlg.cmd.textContent = cmd || "—";
    dlg.err.textContent = error || "";
    dlg.note.textContent = note || "";
    dlg.extra.replaceChildren(...(extra ? [extra] : []));
    dlg.ok.disabled = !!error;
    dlg.onCancel = onCancel || null;
    let busy = false;
    dlg.action = async () => {
      if (busy || dlg.ok.disabled) return; // um clique = uma escrita
      busy = true;
      dlg.ok.disabled = true;
      dlg.err.textContent = "Enviando…";
      const msg = await send();
      busy = false;
      if (msg) { dlg.err.textContent = msg; dlg.ok.disabled = false; return; }
      dlg.onCancel = null;
      closeDialog();
    };
    dlg.root.classList.add("open");
    dlg.ok.focus();
  }
  function setDialogCmd(cmd, error) {
    dlg.cmd.textContent = cmd || "—";
    dlg.err.textContent = error || "";
    dlg.ok.disabled = !!error;
  }
  function closeDialog() {
    dlg.root.classList.remove("open");
    dlg.action = null;
    const cancel = dlg.onCancel;
    dlg.onCancel = null;
    if (cancel) cancel();
  }
  dlg.ok.addEventListener("click", () => dlg.action && dlg.action());
  dlg.cancel.addEventListener("click", closeDialog);
  dlg.root.addEventListener("click", (e) => { if (e.target === dlg.root) closeDialog(); });
  document.addEventListener("keydown", (e) => {
    if (!dlg.action) return;
    if (e.key === "Escape") closeDialog();
    if (e.key === "Enter") { e.preventDefault(); dlg.action(); }
  });

  let toastTimer = null;
  function toast(text, isError) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.className = "show " + (isError ? "err" : "ok");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = ""), 4000);
  }

  // ---------- envio ----------
  async function postJson(url, body) {
    try {
      const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) return { error: "Erro: " + data.error };
      return { data };
    } catch (e) {
      return { error: "Falha: " + e.message };
    }
  }
  async function riskFor(path) {
    try { return (await (await fetch("/api/risk?path=" + encodeURIComponent(path))).json()).risk || ""; } catch { return ""; }
  }

  /**
   * Confirma e envia um parâmetro pela rota genérica (/api/param), que valida contra a
   * descrição da própria mesa. argText: como o comando aparece na janela.
   */
  async function confirmParam({ path, value, argText, title, note, onCancel, done }) {
    const risk = await riskFor(path);
    openDialog({
      title,
      cmd: `${path} ${argText}`,
      note: [risk, note].filter(Boolean).join(" "),
      send: async () => {
        const r = await postJson("/api/param", { path, value });
        if (r.error) return r.error;
        if (!r.data.ok) return `A mesa não confirmou. Valor lido: ${r.data.readBack.text}`;
        if (done) done();
        return null;
      },
      onCancel,
    });
  }

  // ---------- campos editáveis (Enter confirma, Esc desfaz) ----------
  function bindEditable(input, currentText, onCommit) {
    input.addEventListener("focus", () => { if (!input.readOnly) { input.dataset.editing = "1"; input.select(); } });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); input.blur(); }
      if (e.key === "Escape") { input.value = currentText(); input.blur(); }
    });
    input.addEventListener("blur", () => {
      if (input.value !== currentText()) onCommit(input.value);
      else delete input.dataset.editing;
    });
  }
  function endEdit(input, text) { delete input.dataset.editing; input.value = text; }

  const label = (st) => st.name || `${PREFIX[st.kind]} ${st.index}`;
  // Estado atual do strip (o objeto é trocado a cada evento da mesa).
  const now = (st) => strips[st.kind][st.index - 1];
  const writable = () => !!(lastStatus && lastStatus.writesEnabled);

  function editName(st, c, text) {
    const revert = () => endEdit(c.name, now(st).name);
    if (!writable()) return revert();
    let error = null;
    if (text.length > 16) error = "Máximo de 16 caracteres.";
    else if (!/^[\x20-\x7e]*$/.test(text)) error = "Use só letras sem acento, números e símbolos.";
    const path = `/${st.kind}/${st.index}/name`;
    confirmParam({
      path, value: text, argText: `,s ${JSON.stringify(text)}`,
      title: `Renomear ${PREFIX[st.kind]} ${st.index}: ${JSON.stringify(st.name)} → ${JSON.stringify(text)}`,
      onCancel: revert, done: () => { toast(`${PREFIX[st.kind]} ${st.index} renomeado`); revert(); },
    }).then(() => error && setDialogCmd(dlg.cmd.textContent, error));
  }

  function editFader(st, c, text) {
    const revert = () => endEdit(c.fdr, fmtNum(now(st).faderDb));
    if (!writable()) return revert();
    const db = parseDb(text);
    const path = `/${st.kind}/${st.index}/fdr`;
    const error = Number.isNaN(db) ? "Digite um número em dB (ex.: -5, 0, +3) ou -inf." : (db < -144 || db > 10) ? "O fader vai de -∞ (-144) até +10 dB." : null;
    confirmParam({
      path, value: db, argText: `,f ${db}`,
      title: `Fader "${label(st)}": ${fmtDb(st.faderDb ?? -144)} → ${error ? text : fmtDb(db)}`,
      note: !error && db > (st.faderDb ?? -144) + 6 ? "Atenção: aumento de mais de 6 dB." : "",
      onCancel: revert, done: () => { toast(`Fader de ${label(st)} em ${fmtDb(db)}`); revert(); },
    }).then(() => error && setDialogCmd("—", error));
  }

  function editPan(st, c, text) {
    const revert = () => endEdit(c.pan, fmtPan(now(st).pan));
    if (!writable()) return revert();
    const v = parsePan(text);
    const path = `/${st.kind}/${st.index}/pan`;
    const error = Number.isNaN(v) ? "Use L30, R20, C ou um número de -100 a 100." : (v < -100 || v > 100) ? "O pan vai de L100 a R100." : null;
    confirmParam({
      path, value: v, argText: `,f ${v}`,
      title: `Pan "${label(st)}": ${fmtPan(st.pan)} → ${error ? text : fmtPan(v)}`,
      onCancel: revert, done: () => { toast(`Pan de ${label(st)} em ${fmtPan(v)}`); revert(); },
    }).then(() => error && setDialogCmd("—", error));
  }

  function toggle(st, key, param, word) {
    if (!writable() || st[key] == null) return;
    const on = !st[key];
    confirmParam({
      path: `/${st.kind}/${st.index}/${param}`, value: on ? 1 : 0, argText: `,i ${on ? 1 : 0}`,
      title: `${on ? word[0] : word[1]} "${label(st)}"?`,
      done: () => toast(`${label(st)}: ${on ? word[2] : word[3]}`),
    });
  }

  function editColor(st) {
    if (!writable()) return;
    const box = document.createElement("div");
    box.className = "swatches";
    const path = `/${st.kind}/${st.index}/col`;
    let sendColor = st.col;
    COLORS.forEach((hex, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.style.background = hex;
      b.textContent = i + 1;
      b.title = `Cor ${i + 1}`;
      if (i + 1 === st.col) b.classList.add("sel");
      b.addEventListener("click", () => {
        sendColor = i + 1;
        box.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b));
        setDialogCmd(`${path} ,i ${sendColor}`, sendColor === st.col ? "Essa já é a cor atual." : null);
      });
      box.appendChild(b);
    });
    openDialog({
      title: `Cor de "${label(st)}"`, extra: box, cmd: `${path} ,i ${sendColor}`, error: "Escolha uma cor.",
      send: async () => {
        const r = await postJson("/api/param", { path, value: sendColor });
        if (r.error) return r.error;
        if (!r.data.ok) return `A mesa não confirmou. Valor lido: ${r.data.readBack.text}`;
        toast(`Cor de ${label(st)} alterada`);
        return null;
      },
    });
  }

  // Ganho fica na fonte do canal: rota própria que confere a fonte antes de escrever.
  async function editGain(st, c, text) {
    const revert = () => endEdit(c.gain, fmtNum(now(st).gainDb));
    if (!writable()) return revert();
    const db = parseDb(text);
    let error = Number.isNaN(db) ? "Digite um número em dB (ex.: 20, 32.5)." : null;
    let src = null;
    try {
      const res = await fetch(`/api/channels/${st.index}/source`);
      src = await res.json();
      if (!res.ok) error = error || src.error;
      else if (!src.gainAddress) error = error || `Este canal usa a fonte ${src.grp} ${src.in}, que não tem ganho ajustável.`;
    } catch (e) {
      error = error || "Não foi possível ler a fonte do canal: " + e.message;
    }
    const srcName = src && src.grp ? `${src.grp} ${src.in}${src.alt ? " (entrada alternativa)" : ""}` : "?";
    openDialog({
      title: `Ganho "${label(st)}": ${fmtDb(st.gainDb ?? 0)} → ${error ? text : fmtDb(db)}`,
      cmd: error || !src ? "—" : `${src.gainAddress} ,f ${db}`, error,
      note: error ? "" : `O ganho fica na fonte ${srcName}: muda em todos os canais que usam essa fonte.` +
        (db > (st.gainDb ?? 0) + 6 ? " Atenção: aumento de mais de 6 dB." : ""),
      send: async () => {
        const r = await postJson(`/api/channels/${st.index}/gain`, { db });
        if (r.error) return r.error;
        if (!r.data.ok) return `A mesa não confirmou. Valor lido: ${fmtDb(r.data.readBack)}`;
        toast(`Ganho de ${label(st)} (${srcName}) em ${fmtDb(db)}`);
        revert();
        return null;
      },
      onCancel: revert,
    });
  }

  // ---------- cards ----------
  function info(kind) { return kinds.find((k) => k.kind === kind); }
  const has = (kind, p) => info(kind).params.includes(p);

  function card(st) {
    const key = `${st.kind}/${st.index}`;
    if (cards[key]) return cards[key];
    const k = info(st.kind);
    const el = document.createElement("div");
    el.className = "ch";
    el.innerHTML = `${has(st.kind, "col") ? '<button type="button" class="colbar" title="Cor"></button>' : ""}
      <div class="num">${PREFIX[st.kind]} ${st.index}</div>
      <input class="name" maxlength="16" placeholder="(sem nome)" spellcheck="false" autocomplete="off" readonly>
      ${k.meter ? '<div class="meter"><div class="bar"></div><div class="bar"></div></div>' : ""}
      <div class="btns"><button type="button" class="tag mute-tag" disabled></button>
        ${has(st.kind, "$solo") ? '<button type="button" class="tag solo-tag" disabled title="Solo">S</button>' : ""}
        ${st.kind === "ch" ? '<button type="button" class="tag eq-tag" title="Abrir o EQ do canal">EQ</button>' : ""}</div>
      ${has(st.kind, "fdr") ? '<label class="row"><span>Fader</span><span class="val"><input class="num-in fdr" readonly autocomplete="off"> dB</span></label>' : ""}
      ${has(st.kind, "pan") ? '<label class="row"><span>Pan</span><span class="val"><input class="num-in pan" readonly autocomplete="off"></span></label>' : ""}
      ${has(st.kind, "in/set/$g") ? '<label class="row"><span>Ganho</span><span class="val"><input class="num-in gain" readonly autocomplete="off"> dB</span></label>' : ""}`;
    const c = {
      el, st, colbar: el.querySelector(".colbar"), name: el.querySelector(".name"), bars: el.querySelectorAll(".bar"),
      mute: el.querySelector(".mute-tag"), solo: el.querySelector(".solo-tag"),
      fdr: el.querySelector(".fdr"), pan: el.querySelector(".pan"), gain: el.querySelector(".gain"),
    };
    const cur = () => strips[st.kind][st.index - 1];
    bindEditable(c.name, () => cur().name, (t) => editName(cur(), c, t));
    c.mute.addEventListener("click", () => toggle(cur(), "mute", "mute", ["Mutar", "Desmutar", "mutado", "desmutado"]));
    if (c.solo) c.solo.addEventListener("click", () => toggle(cur(), "solo", "$solo", ["Ligar solo de", "Desligar solo de", "solo ligado", "solo desligado"]));
    if (c.colbar) c.colbar.addEventListener("click", () => editColor(cur()));
    const eqBtn = el.querySelector(".eq-tag");
    if (eqBtn) eqBtn.addEventListener("click", () => openEq(st.index));
    if (c.fdr) { c.fdr.value = "—"; bindEditable(c.fdr, () => fmtNum(cur().faderDb), (t) => editFader(cur(), c, t)); }
    if (c.pan) { c.pan.value = "—"; bindEditable(c.pan, () => fmtPan(cur().pan), (t) => editPan(cur(), c, t)); }
    if (c.gain) { c.gain.value = "—"; bindEditable(c.gain, () => fmtNum(cur().gainDb), (t) => editGain(cur(), c, t)); }
    cards[key] = c;
    return c;
  }

  function render(st) {
    strips[st.kind][st.index - 1] = st;
    if (st.kind === "ch") updateChip(st);
    if (st.kind !== active) return;
    const c = card(st);
    if (!c.name.dataset.editing && c.name.value !== st.name && document.activeElement !== c.name) c.name.value = st.name;
    if (c.colbar) c.colbar.style.background = st.col ? COLORS[st.col - 1] : "var(--line)";
    c.el.classList.toggle("muted", st.mute === true);
    c.mute.textContent = st.mute == null ? "—" : st.mute ? "MUTE" : "ativo";
    c.mute.classList.toggle("on", st.mute === true);
    if (c.solo) c.solo.classList.toggle("on", st.solo === true);
    if (c.fdr && !c.fdr.dataset.editing) c.fdr.value = fmtNum(st.faderDb);
    if (c.pan && !c.pan.dataset.editing) c.pan.value = fmtPan(st.pan);
    if (c.gain && !c.gain.dataset.editing) c.gain.value = fmtNum(st.gainDb);
    const w = writable();
    c.name.readOnly = !w;
    c.mute.disabled = !w || st.mute == null;
    if (c.solo) c.solo.disabled = !w || st.solo == null;
    if (c.colbar) c.colbar.disabled = !w;
    if (c.fdr) c.fdr.readOnly = !w || st.faderDb == null;
    if (c.pan) c.pan.readOnly = !w || st.pan == null;
    if (c.gain) c.gain.readOnly = !w || st.gainDb == null;
    renderMeter(st);
  }

  function renderMeter(st) {
    const c = cards[`${st.kind}/${st.index}`];
    if (!c || !c.bars.length || st.kind !== active) return;
    c.bars[0].style.setProperty("--h", pct(st.meter && st.meter.l) + "%");
    c.bars[1].style.setProperty("--h", pct(st.meter && st.meter.r) + "%");
  }

  function showTab(kind) {
    if (kind !== "eq" && !info(kind)) kind = "ch";
    active = kind;
    try { localStorage.setItem("wing-tab", kind); } catch {}
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.kind === kind));
    const isEq = kind === "eq";
    grid.hidden = isEq;
    eqPanel.hidden = !isEq;
    document.body.classList.toggle("eq-mode", isEq);
    if (isEq) return showEq();
    grid.replaceChildren();
    for (const st of strips[kind]) grid.appendChild(card(st).el);
    for (const st of strips[kind]) render(st);
  }

  function buildTabs() {
    const nav = document.getElementById("tabs");
    nav.replaceChildren();
    for (const k of kinds) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.kind = k.kind;
      b.innerHTML = `${k.label}<span class="count">${k.count}</span>`;
      b.addEventListener("click", () => showTab(k.kind));
      nav.appendChild(b);
    }
    const eqTab = document.createElement("button");
    eqTab.type = "button";
    eqTab.dataset.kind = "eq";
    eqTab.textContent = "EQ";
    eqTab.addEventListener("click", () => showTab("eq"));
    nav.appendChild(eqTab);
  }

  // ---------- painel de EQ ----------
  // Sem etapa de confirmação (pedido do usuário enquanto não está ao vivo): ao soltar o ponto
  // arrastado, tocar em −/+, digitar ou escolher uma opção, o valor fica PENDENTE (curva branca;
  // a tracejada é o que está na mesa) e é enviado na hora. A rota valida cada comando na
  // descrição da mesa e lê de volta; a barra de status mostra o comando exato e os avisos.
  const BANDS = [
    { id: "l", label: "LOW", short: "L", shape: "leq" }, { id: "1", label: "1", short: "1" },
    { id: "2", label: "2", short: "2" }, { id: "3", label: "3", short: "3" },
    { id: "4", label: "4", short: "4" }, { id: "h", label: "HIGH", short: "H", shape: "heq" },
  ];
  const BAND_COLORS = { l: "#ff6b5e", 1: "#ffb02e", 2: "#f2e94e", 3: "#4be37a", 4: "#3ec8ff", h: "#d08bff" };
  const DB_RANGE = 18; // a escala vai de -18 a +18 dB (ganho das bandas: ±15)
  const eqPanel = document.getElementById("eq");
  const svg = document.getElementById("eq-graph");
  let curveLib = null;
  let eqCh = 1;
  try { eqCh = Number(localStorage.getItem("wing-eq-ch")) || 1; } catch {}
  // Link direto: http://localhost:3000/#eq/5 abre o EQ do CH 5.
  const eqHash = /^#eq(?:\/(\d+))?$/.exec(location.hash);
  if (eqHash) {
    active = "eq";
    if (eqHash[1] && Number(eqHash[1]) >= 1 && Number(eqHash[1]) <= 40) eqCh = Number(eqHash[1]);
  }
  let eqData = null; // GET /api/channels/N/eq
  let eqError = null;
  let eqLoadToken = 0;
  let selBand = "1";
  const pending = new Map(); // "eq/1g" -> valor
  let G = { w: 800, h: 340 };
  let handles = [];
  let drag = null;

  import("/eq-curve.js").then((m) => { curveLib = m; renderEq(); }, () => { eqError = "Não foi possível carregar /eq-curve.js"; renderEq(); });

  const fmtHz = (f) => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + "k" : f.toFixed(f < 100 ? 1 : 0);
  const fmtGain = (g) => (g > 0 ? "+" : "") + g.toFixed(1);
  const fmtQ = (q) => q.toFixed(2);
  // "1k2", "1.2k", "1200", "1200 Hz" -> 1200
  function parseHz(text) {
    const t = text.trim().toLowerCase().replace(",", ".").replace(/\s*hz$/, "");
    let m = /^(\d+)k(\d*)$/.exec(t);
    if (m) return Number(m[1] + "." + (m[2] || "0")) * 1000;
    m = /^(\d+(?:\.\d+)?)k$/.exec(t);
    if (m) return Number(m[1]) * 1000;
    return /^\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
  }
  const parseNum = (text) => { const t = text.trim().replace(",", ".").replace(/\s*db$/i, ""); return /^[+-]?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN; };
  const inkOn = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150 ? "#000" : "#fff"; };
  const chColor = (st) => st && st.col ? COLORS[st.col - 1] : "#6b7c93";
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const eqDesc = (sec, p) => eqData && eqData[sec][p];
  const eqCur = (sec, p) => { const d = eqDesc(sec, p); return d ? d.value : null; };
  const eqVal = (sec, p) => pending.has(`${sec}/${p}`) ? pending.get(`${sec}/${p}`) : eqCur(sec, p);
  const isChanged = (sec, p) => pending.has(`${sec}/${p}`);
  const canEditEq = () => writable() && !!eqData && eqData.editable && !!curveLib;

  function sameValue(d, a, b) {
    if (typeof a !== "number" || typeof b !== "number") return a === b;
    return d.type === "log" ? Math.abs(a / b - 1) < 0.001 : Math.abs(a - b) < 0.005;
  }

  /** Muda o valor pendente (limitado e arredondado ao passo da faixa que a mesa descreveu). */
  function setPending(sec, p, v) {
    const d = eqDesc(sec, p);
    if (!d || !canEditEq() || v == null || (typeof v === "number" && !Number.isFinite(v))) return;
    if (typeof v === "number" && (d.type === "lin" || d.type === "log")) {
      const q = curveLib.quantize(v, d);
      v = d.type === "log" ? Number(q.toPrecision(5)) : Math.round(q * 100) / 100;
    }
    const k = `${sec}/${p}`;
    if (sameValue(d, v, d.value)) pending.delete(k);
    else pending.set(k, v);
  }

  function curveModel(get) {
    const num = (sec, p) => { const v = get(sec, p); return typeof v === "number" ? v : null; };
    const bands = [];
    for (const b of BANDS) {
      const f = num("eq", b.id + "f"), g = num("eq", b.id + "g"), q = num("eq", b.id + "q");
      if (f == null || g == null || q == null) continue;
      const shape = b.shape && get("eq", b.shape) === "SHV" ? (b.id === "l" ? "low" : "high") : "peq";
      bands.push({ id: b.id, shape, f, g, q });
    }
    const cut = (on, f, s) => num("flt", f) == null ? null : { on: num("flt", on) === 1, f: num("flt", f), slope: Number(get("flt", s)) || 12 };
    return { eqOn: num("eq", "on") === 1, bands, lc: cut("lc", "lcf", "lcs"), hc: cut("hc", "hcf", "hcs") };
  }

  // ---- curva (SVG em pixels: o viewBox acompanha a largura) ----
  const fx = (f) => (Math.log(f / 20) / Math.log(1000)) * G.w;
  const xf = (x) => 20 * Math.pow(1000, clamp(x, 0, G.w) / G.w);
  const dy = (db) => G.h / 2 - (db / DB_RANGE) * (G.h / 2 - 14);
  const yd = (y) => ((G.h / 2 - y) / (G.h / 2 - 14)) * DB_RANGE;

  function drawEq() {
    if (eqPanel.hidden) return;
    const w = Math.max(280, Math.round(document.getElementById("eq-graph-wrap").clientWidth - 4));
    G = { w, h: Math.round(clamp(w * 0.42, 240, 420)) };
    const h = G.h;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    let s = "";
    for (const f of [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]) {
      const x = fx(f);
      s += `<line class="g${[100, 1000, 10000].includes(f) ? " g-major" : ""}" x1="${x}" x2="${x}" y1="0" y2="${h}"/>`;
      if (f > 20 && f < 20000) s += `<text class="gl" x="${x + 3}" y="${h - 6}">${f >= 1000 ? f / 1000 + "k" : f}</text>`;
    }
    for (const db of [-12, -6, 0, 6, 12]) {
      const y = dy(db);
      s += `<line class="g${db === 0 ? " g-major" : ""}" x1="0" x2="${w}" y1="${y}" y2="${y}"/>`;
      s += `<text class="gl" x="4" y="${y - 4}">${db > 0 ? "+" + db : db}</text>`;
    }
    handles = [];
    if (!eqData || !curveLib) { svg.innerHTML = s; return; }
    const freqs = curveLib.logFreqs(Math.min(480, Math.round(w / 2)));
    const pathFor = (model) => freqs.map((f, i) =>
      `${i ? "L" : "M"}${fx(f).toFixed(1)},${clamp(dy(curveLib.responseDb(model, f)), -4, h + 4).toFixed(1)}`).join("");
    const cur = curveModel(eqCur), next = curveModel(eqVal);
    const main = pathFor(next);
    const st = strips.ch && strips.ch[eqCh - 1];
    s += `<path class="c-fill" style="fill:${chColor(st)}" d="${main}L${w},${dy(0)}L0,${dy(0)}Z"/>`;
    if (pending.size) s += `<path class="c-old" d="${pathFor(cur)}"/>`;
    const sb = next.bands.find((b) => b.id === selBand);
    if (sb && next.eqOn) s += `<path class="c-band" style="stroke:${BAND_COLORS[sb.id]}" d="${pathFor({ eqOn: true, bands: [sb], lc: null, hc: null })}"/>`;
    s += `<path class="c-main" d="${main}"/>`;
    for (const [key, cut, text] of [["lc", next.lc, "HP"], ["hc", next.hc, "LP"]]) {
      if (!cut) continue;
      const x = clamp(fx(cut.f), 20, w - 20), y = h - 36;
      handles.push({ key, filter: true, x, y });
      s += `<g class="h-flt${cut.on ? "" : " off"}"><rect x="${x - 20}" y="${y - 14}" width="40" height="28" rx="7"/>` +
        `<text class="hl" x="${x}" y="${y + 5}">${text}</text></g>`;
    }
    for (const b of next.bands) {
      const x = clamp(fx(b.f), 16, w - 16), y = clamp(dy(b.g), 16, h - 16);
      handles.push({ key: b.id, filter: false, x, y });
      s += `<g class="h${next.eqOn ? "" : " dim"}">${b.id === selBand ? `<circle class="ring" cx="${x}" cy="${y}" r="20"/>` : ""}` +
        `<circle cx="${x}" cy="${y}" r="14" style="fill:${BAND_COLORS[b.id]}"/>` +
        `<text class="hl" x="${x}" y="${y + 5}">${BANDS.find((x) => x.id === b.id).short}</text></g>`;
    }
    svg.innerHTML = s;
  }

  function svgPoint(e) {
    const r = svg.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * G.w, y: ((e.clientY - r.top) / r.height) * G.h };
  }
  function nearestHandle(p, radius) {
    let best = null, bestD = radius;
    // Bandas por último no desenho = por cima: procura de trás para frente.
    for (let i = handles.length - 1; i >= 0; i--) {
      const hd = handles[i], d = Math.hypot(hd.x - p.x, hd.y - p.y);
      if (d < bestD) { best = hd; bestD = d; }
    }
    return best;
  }
  svg.addEventListener("pointerdown", (e) => {
    const hit = nearestHandle(svgPoint(e), e.pointerType === "touch" ? 36 : 26);
    if (!hit) return;
    e.preventDefault();
    if (!hit.filter) selBand = hit.key;
    drag = canEditEq() ? { key: hit.key, filter: hit.filter, id: e.pointerId } : null;
    if (drag) svg.setPointerCapture(e.pointerId);
    renderEq();
  });
  svg.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = svgPoint(e);
    if (drag.filter) setPending("flt", drag.key + "f", xf(p.x));
    else { setPending("eq", drag.key + "f", xf(p.x)); setPending("eq", drag.key + "g", yd(p.y)); }
    renderEq();
  });
  const endDrag = (e) => { if (drag && e.pointerId === drag.id) { drag = null; sendEq(); } };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  // Roda do mouse sobre uma banda: Q.
  svg.addEventListener("wheel", (e) => {
    const hit = nearestHandle(svgPoint(e), 26);
    if (!hit || hit.filter || !canEditEq()) return;
    e.preventDefault();
    selBand = hit.key;
    const q = eqVal("eq", hit.key + "q");
    if (typeof q === "number") setPending("eq", hit.key + "q", q * (e.deltaY < 0 ? 1.06 : 1 / 1.06));
    renderEq();
    // Envia quando a roda para (um comando com o Q final, não um por passo da roda).
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(sendEq, 400);
  }, { passive: false });
  let wheelTimer = null;

  // ---- controles ----
  /** Linha [rótulo] [−] [valor] [+]. o: { sec, param(), step(v, dir), fmt, parse } */
  function stepper(text, o) {
    const el = document.createElement("div");
    el.className = "stp";
    el.innerHTML = `<span class="stp-l"></span><button type="button" class="big" aria-label="Diminuir">−</button>` +
      `<input class="stp-v" inputmode="decimal" autocomplete="off" spellcheck="false"><button type="button" class="big" aria-label="Aumentar">+</button>`;
    el.querySelector(".stp-l").textContent = text;
    const [minus, plus] = el.querySelectorAll("button");
    const input = el.querySelector("input");
    const get = () => eqVal(o.sec, o.param());
    const bump = (dir) => { const v = get(); if (typeof v === "number") { setPending(o.sec, o.param(), o.step(v, dir)); renderEq(); sendEq(); } };
    minus.addEventListener("click", () => bump(-1));
    plus.addEventListener("click", () => bump(1));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = o.fmt(get()); input.blur(); }
    });
    input.addEventListener("blur", () => {
      const v = get();
      if (v == null || input.value === o.fmt(v)) return;
      const n = o.parse(input.value);
      if (Number.isNaN(n)) { toast(`${text}: valor inválido (“${input.value}”)`, true); input.value = o.fmt(v); return; }
      setPending(o.sec, o.param(), n);
      renderEq();
      sendEq();
    });
    return {
      el,
      update() {
        const v = get(), en = canEditEq() && typeof v === "number";
        if (document.activeElement !== input) input.value = typeof v === "number" ? o.fmt(v) : "—";
        input.readOnly = !en;
        minus.disabled = plus.disabled = !en;
        el.classList.toggle("changed", isChanged(o.sec, o.param()));
      },
    };
  }
  /** Botões de escolha (tipo de banda, inclinação). */
  function segmented(options, o) {
    const el = document.createElement("div");
    el.className = "seg";
    const btns = options.map(([value, text]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "big";
      b.textContent = text;
      b.addEventListener("click", () => { setPending(o.sec, o.param(), value); renderEq(); sendEq(); });
      el.appendChild(b);
      return [value, b];
    });
    return {
      el,
      update() {
        const v = eqVal(o.sec, o.param()), en = canEditEq() && v != null;
        for (const [value, b] of btns) { b.classList.toggle("on", value === v); b.disabled = !en; b.setAttribute("aria-pressed", String(value === v)); }
        el.classList.toggle("changed", isChanged(o.sec, o.param()));
      },
    };
  }
  /** Botão liga/desliga de um parâmetro int 0..1. */
  function onOff(btn, sec, param, text) {
    btn.addEventListener("click", () => { const v = eqVal(sec, param); if (v === 0 || v === 1) { setPending(sec, param, v ? 0 : 1); renderEq(); sendEq(); } });
    return {
      update() {
        const v = eqVal(sec, param);
        btn.textContent = `${text ? text + " " : ""}${v === 1 ? "ON" : v === 0 ? "OFF" : "—"}`;
        btn.classList.toggle("on", v === 1);
        btn.setAttribute("aria-pressed", String(v === 1));
        btn.disabled = !canEditEq() || v == null;
        btn.style.boxShadow = isChanged(sec, param) ? "0 0 0 3px var(--go)" : "";
      },
    };
  }

  const freqStep = (v, dir) => v * Math.pow(2, dir / 6); // 1/6 de oitava
  const controls = [];
  const bandButtons = {};
  function buildEqControls() {
    const bandsEl = document.getElementById("eq-bands");
    for (const b of BANDS) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "big band";
      btn.style.setProperty("--bc", BAND_COLORS[b.id]);
      btn.innerHTML = `<span></span><small></small>`;
      btn.firstChild.textContent = b.label;
      btn.addEventListener("click", () => { selBand = b.id; renderEq(); });
      bandsEl.appendChild(btn);
      bandButtons[b.id] = btn;
    }
    const card = document.getElementById("eq-band-card");
    card.innerHTML = `<h3 id="eq-band-title"></h3>`;
    const p = (s) => () => selBand + s;
    const shapeSeg = segmented([["PEQ", "PEQ"], ["SHV", "Shelf"]], { sec: "eq", param: () => (selBand === "l" ? "leq" : "heq") });
    const rows = [
      stepper("Frequência", { sec: "eq", param: p("f"), step: freqStep, fmt: fmtHz, parse: parseHz }),
      stepper("Ganho dB", { sec: "eq", param: p("g"), step: (v, d) => v + d * 0.5, fmt: fmtGain, parse: parseNum }),
      stepper("Q", { sec: "eq", param: p("q"), step: (v, d) => v * Math.pow(2, d / 4), fmt: fmtQ, parse: parseNum }),
    ];
    for (const r of rows) card.appendChild(r.el);
    card.appendChild(shapeSeg.el);
    controls.push(...rows, {
      update() {
        const band = BANDS.find((b) => b.id === selBand);
        card.style.setProperty("--bc", BAND_COLORS[selBand]);
        const title = document.getElementById("eq-band-title");
        title.textContent = `Banda ${band.label}`;
        title.classList.toggle("changed", ["f", "g", "q"].some((s) => isChanged("eq", selBand + s)) || (!!band.shape && isChanged("eq", band.shape)));
        shapeSeg.el.hidden = !band.shape;
        if (band.shape) shapeSeg.update();
      },
    });
    for (const [id, title, on, f, s, slopes] of [
      ["eq-hpf", "Passa-alta (HPF)", "lc", "lcf", "lcs", ["6", "12", "18", "24"]],
      ["eq-lpf", "Passa-baixa (LPF)", "hc", "hcf", "hcs", ["6", "12"]],
    ]) {
      const el = document.getElementById(id);
      el.innerHTML = `<h3><span></span><button type="button" class="big toggle"></button></h3><p class="eq-risk"></p>`;
      el.querySelector("h3 span").textContent = title;
      const riskEl = el.querySelector(".eq-risk");
      const toggle = onOff(el.querySelector("h3 button"), "flt", on, "");
      const freq = stepper("Frequência", { sec: "flt", param: () => f, step: freqStep, fmt: fmtHz, parse: parseHz });
      const slope = segmented(slopes.map((v) => [v, v + " dB/oit"]), { sec: "flt", param: () => s });
      el.append(freq.el, slope.el);
      controls.push(toggle, freq, slope, {
        update() {
          el.querySelector("h3").classList.toggle("changed", [on, f, s].some((x) => isChanged("flt", x)));
          // Aviso de risco sempre visível (não há confirmação antes de enviar).
          const d = eqDesc("flt", on);
          riskEl.textContent = d && d.risk && canEditEq() ? "⚠ " + d.risk : "";
        },
      });
    }
    controls.push(onOff(document.getElementById("eq-on"), "eq", "on", "EQ"));
    document.getElementById("eq-reload").addEventListener("click", () => {
      if (sending) return toast("Aguarde o envio terminar.", true);
      pending.clear();
      loadEq(eqCh);
    });
    new ResizeObserver(() => drawEq()).observe(document.getElementById("eq-graph-wrap"));
  }

  // ---- canais ----
  const chips = {};
  function buildChips() {
    const box = document.getElementById("eq-chips");
    if (box.childElementCount || !strips.ch) return;
    for (const st of strips.ch) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "big chip";
      b.innerHTML = `<b></b><span></span>`;
      b.addEventListener("click", () => selectEqChannel(st.index));
      box.appendChild(b);
      chips[st.index] = b;
      updateChip(st);
    }
  }
  function updateChip(st) {
    const b = chips[st.index];
    if (!b) return;
    const color = chColor(st);
    b.style.setProperty("--chip", color);
    b.style.setProperty("--chip-ink", inkOn(color));
    b.querySelector("b").textContent = `CH ${st.index}`;
    b.querySelector("span").textContent = st.name || "—";
    b.classList.toggle("sel", st.index === eqCh);
    b.setAttribute("aria-pressed", String(st.index === eqCh));
    if (st.index === eqCh && !eqPanel.hidden) renderEqHead();
  }

  function selectEqChannel(ch) {
    if (ch === eqCh && eqData) return;
    if (sending || drag) return toast("Aguarde o envio terminar.", true);
    pending.clear();
    hideEqStatus();
    eqData = null;
    eqCh = ch;
    try { localStorage.setItem("wing-eq-ch", String(ch)); } catch {}
    if (strips.ch) strips.ch.forEach(updateChip);
    scrollToChip();
    loadEq(ch);
  }
  // Rola só a fileira de canais (scrollIntoView rolaria a página inteira).
  function scrollToChip() {
    const b = chips[eqCh], box = document.getElementById("eq-chips");
    if (b) box.scrollLeft = b.offsetLeft - box.offsetLeft - (box.clientWidth - b.offsetWidth) / 2;
  }
  function openEq(ch) {
    showTab("eq");
    selectEqChannel(ch);
  }
  function showEq() {
    buildChips();
    if (strips.ch) strips.ch.forEach(updateChip);
    scrollToChip();
    // Sem alterações pendentes, relê ao abrir (a mesa pode ter mudado por fora).
    if (!pending.size || !eqData || eqData.ch !== eqCh) loadEq(eqCh);
    else renderEq();
  }

  async function loadEq(ch) {
    const token = ++eqLoadToken;
    eqError = null;
    renderEq();
    try {
      const res = await fetch(`/api/channels/${ch}/eq`);
      const data = await res.json();
      if (token !== eqLoadToken) return;
      if (!res.ok) throw new Error(data.error);
      eqData = data;
    } catch (e) {
      if (token !== eqLoadToken) return;
      eqError = "Não foi possível ler o EQ da mesa: " + e.message;
    }
    renderEq();
  }

  /** Valor vindo da mesa (GET, leitura de volta ou evento da assinatura). */
  function applyEqValue(d, v) {
    if (d.type === "list" || d.type === "string") { if (v.kind === "string") d.value = v.text; }
    else if (v.kind !== "string") d.value = v.value;
  }
  const EQ_PATH = /^\/ch\/(\d+)\/(eq|flt)\/([^/]+)$/;
  function onEqParam(path, value) {
    const m = EQ_PATH.exec(path);
    if (!m || !eqData || Number(m[1]) !== eqData.ch) return;
    if (m[2] === "eq" && m[3] === "mdl" && value.kind === "string") {
      eqData.model = value.text;
      eqData.editable = value.text === "STD";
    } else {
      const d = eqData[m[2]][m[3]];
      if (!d) return;
      applyEqValue(d, value);
      const k = `${m[2]}/${m[3]}`;
      if (pending.has(k) && sameValue(d, pending.get(k), d.value)) pending.delete(k);
    }
    if (active === "eq") renderEq();
  }

  function renderEqHead() {
    const st = strips.ch && strips.ch[eqCh - 1];
    const color = chColor(st);
    eqPanel.style.setProperty("--cc", color);
    eqPanel.style.setProperty("--cc-ink", inkOn(color));
    document.getElementById("eq-chnum").textContent = `CH ${eqCh}`;
    document.getElementById("eq-chname").textContent = st && st.name ? st.name : "(sem nome)";
    document.getElementById("eq-model").textContent = eqData && eqData.model ? `EQ ${eqData.model}` : "";
  }

  function renderEq() {
    if (eqPanel.hidden) return;
    if (!controls.length) buildEqControls();
    renderEqHead();
    const msg = document.getElementById("eq-msg");
    let text = "";
    if (eqError) text = eqError;
    else if (!eqData) text = `Lendo o EQ do CH ${eqCh} na mesa…`;
    else if (!eqData.editable) text = `Este canal usa o EQ ${eqData.model || "?"}: o painel só edita o modelo STD (só leitura aqui).`;
    else if (!writable()) text = "Somente leitura: dá para ver a curva, mas mudanças pedem WING_ALLOW_WRITES=1.";
    msg.textContent = text;
    msg.classList.toggle("err", !!eqError);
    for (const b of BANDS) {
      const btn = bandButtons[b.id];
      const f = eqVal("eq", b.id + "f"), g = eqVal("eq", b.id + "g");
      btn.querySelector("small").textContent = typeof f === "number" && typeof g === "number" ? `${fmtHz(f)} · ${fmtGain(g)}` : "—";
      btn.classList.toggle("sel", b.id === selBand);
      btn.setAttribute("aria-pressed", String(b.id === selBand));
      btn.classList.toggle("changed", ["f", "g", "q"].some((s) => isChanged("eq", b.id + s)) || (!!b.shape && isChanged("eq", b.shape)));
    }
    for (const c of controls) c.update();
    drawEq();
  }

  // ---- envio direto ----
  function eqLabel(sec, p) {
    if (sec === "flt") {
      return { lc: "Passa-alta", lcf: "Passa-alta · frequência", lcs: "Passa-alta · inclinação",
        hc: "Passa-baixa", hcf: "Passa-baixa · frequência", hcs: "Passa-baixa · inclinação" }[p];
    }
    if (p === "on") return "EQ";
    if (p === "leq" || p === "heq") return `Banda ${p === "leq" ? "LOW" : "HIGH"} · tipo`;
    return `Banda ${BANDS.find((b) => b.id === p[0]).label} · ${{ f: "frequência", g: "ganho", q: "Q" }[p[1]]}`;
  }
  function eqFmt(p, v) {
    if (v == null) return "—";
    if (p === "on" || p === "lc" || p === "hc") return v === 1 ? "ligado" : "desligado";
    if (p === "leq" || p === "heq") return v === "SHV" ? "shelf" : "PEQ";
    if (p === "lcs" || p === "hcs") return v + " dB/oit";
    if (p.endsWith("f")) return fmtHz(v) + " Hz";
    if (p.endsWith("g")) return fmtGain(v) + " dB";
    if (p.endsWith("q")) return fmtQ(v);
    return String(v);
  }

  let sending = false;
  let sendAgain = false;
  let statusTimer = null;
  function showEqStatus(kind, main, cmds, risks) {
    document.getElementById("eq-status").className = `eq-status show ${kind}`;
    document.getElementById("eq-status-main").textContent = main;
    // Os últimos comandos enviados, exatamente como saíram para a mesa.
    document.getElementById("eq-status-cmd").textContent = cmds.slice(-4).join("\n");
    document.getElementById("eq-status-risk").textContent = [...risks].map((r) => "⚠ " + r).join(" ");
    clearTimeout(statusTimer);
    if (kind === "ok") statusTimer = setTimeout(hideEqStatus, 8000);
  }
  function hideEqStatus() {
    clearTimeout(statusTimer);
    document.getElementById("eq-status").className = "eq-status";
  }

  /**
   * Envia o que está pendente, um comando por vez: a rota valida na descrição da mesa,
   * escreve e lê de volta. Para no primeiro problema e volta a mostrar o que está na mesa.
   */
  async function sendEq() {
    if (!canEditEq() || drag) return;
    if (sending) { sendAgain = true; return; }
    sending = true;
    const ch = eqCh, cmds = [], risks = new Set();
    let error = null;
    try {
      do {
        sendAgain = false;
        for (const [key, value] of [...pending]) {
          const [sec, param] = key.split("/");
          const cur = eqCur(sec, param);
          showEqStatus("sending", `Enviando ${eqLabel(sec, param)}: ${eqFmt(param, value)}…`, cmds, risks);
          const r = await postJson(`/api/channels/${ch}/${sec}`, { param, value });
          if (r.error) { error = `${eqLabel(sec, param)}: ${r.error}`; break; }
          cmds.push(r.data.command);
          if (r.data.risk) risks.add(r.data.risk);
          if (/^[lh1-4]g$/.test(param) && typeof cur === "number" && value > cur + 6) {
            risks.add(`Reforço de mais de 6 dB em ${eqLabel(sec, param)}.`);
          }
          const d = eqDesc(sec, param);
          if (d) applyEqValue(d, r.data.readBack);
          if (pending.get(key) === value) pending.delete(key);
          renderEq();
          if (!r.data.ok) { error = `A mesa não confirmou ${r.data.path} (lido: ${r.data.readBack.text}).`; break; }
        }
      } while (sendAgain && !error && !drag);
    } finally {
      sending = false;
    }
    if (error) {
      pending.clear();
      renderEq();
      showEqStatus("err", `${error.replace(/\.?$/, ".")} Nada mais foi enviado.`, cmds, risks);
    } else if (cmds.length) {
      const n = cmds.length === 1 ? "1 comando enviado e confirmado" : `${cmds.length} comandos enviados e confirmados`;
      showEqStatus(risks.size ? "risk" : "ok", `CH ${ch}: ${n} pela mesa (leitura de volta).`, cmds, risks);
    }
  }

  // ---------- status ----------
  function renderStatus(s) {
    document.getElementById("host").textContent = "Mesa: " + s.host;
    const wasWritable = document.body.classList.contains("writable");
    document.body.classList.toggle("writable", !!s.writesEnabled);
    if (wasWritable !== !!s.writesEnabled && strips[active]) strips[active].forEach(render);
    if (wasWritable !== !!s.writesEnabled && active === "eq") renderEq();
    const mode = document.getElementById("mode");
    mode.textContent = s.writesEnabled ? "Escrita liberada" : "Somente leitura";
    mode.className = "badge " + (s.writesEnabled ? "rw" : "ro");
    const now = Date.now();
    const osc = document.getElementById("osc");
    const oscOk = s.lastOscAt && now - s.lastOscAt < 15000;
    osc.textContent = "OSC: " + (oscOk ? "conectado" : "sem resposta");
    osc.className = "badge " + (oscOk ? "ok" : "err");
    const mtr = document.getElementById("mtr");
    const mOk = s.lastMeterAt && now - s.lastMeterAt < 5000;
    mtr.textContent = "Medidores: " + (mOk ? "recebendo" : "sem dados");
    mtr.className = "badge " + (mOk ? "ok" : "err");
    document.getElementById("info").textContent = (s.consoleInfo || "") + (s.error ? " · " + s.error : "");
  }

  // ---------- eventos do servidor ----------
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => {
    const snap = JSON.parse(e.data);
    kinds = snap.kinds;
    strips = snap.strips;
    lastStatus = snap.status;
    buildTabs();
    buildChips();
    renderStatus(lastStatus);
    showTab(active);
  });
  es.addEventListener("strip", (e) => { if (kinds.length) render(JSON.parse(e.data)); });
  es.addEventListener("param", (e) => { const p = JSON.parse(e.data); onEqParam(p.path, p.value); });
  es.addEventListener("status", (e) => { lastStatus = JSON.parse(e.data); renderStatus(lastStatus); });
  es.addEventListener("meters", (e) => {
    const all = JSON.parse(e.data);
    for (const [kind, list] of Object.entries(all)) {
      if (!strips[kind]) continue;
      list.forEach((m, i) => { const st = strips[kind][i]; if (st) { st.meter = m; renderMeter(st); } });
    }
    if (lastStatus) { lastStatus.lastMeterAt = Date.now(); renderStatus(lastStatus); }
  });
  setInterval(async () => {
    try { lastStatus = (await (await fetch("/api/state")).json()).status; renderStatus(lastStatus); } catch {}
  }, 3000);
</script>
</body>
</html>
