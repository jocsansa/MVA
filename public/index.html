<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WING Remote</title>
<style>
  :root { --bg:#121417; --panel:#1c1f24; --line:#2c3138; --text:#e6e8eb; --muted:#8b939e;
          --green:#3fb950; --yellow:#d29922; --red:#f85149; --mute:#b62324; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; background:var(--panel); border:1px solid var(--line); }
  .ok { color:var(--green); } .err { color:var(--red); }
  .ro { color:var(--yellow); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; padding:16px; }
  .ch { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .ch.muted { border-color:var(--mute); }
  .num { color:var(--muted); font-size:11px; }
  /* Nome: caixa de texto com a mesma aparência do texto; borda só ao passar o mouse/editar. */
  .name { width:100%; margin:0 -4px; padding:1px 4px; font:inherit; font-weight:600; color:var(--text);
    background:transparent; border:1px solid transparent; border-radius:3px; text-overflow:ellipsis; }
  .name::placeholder { color:var(--muted); font-weight:400; font-style:italic; }
  .name:read-only { cursor:default; }
  body.writable .name:hover { border-color:var(--line); }
  body.writable .name:focus { outline:none; border-color:var(--text); background:#0b0c0e; }
  .badge.rw { color:var(--red); border-color:var(--red); }
  .meter { height:90px; display:flex; gap:3px; align-items:flex-end; background:#0b0c0e; border-radius:3px; padding:2px; }
  .bar { flex:1; background:linear-gradient(to top, var(--green) 0 70%, var(--yellow) 70% 88%, var(--red) 88%); border-radius:2px;
         clip-path: inset(calc(100% - var(--h, 0%)) 0 0 0); height:100%; transition: clip-path 60ms linear; }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
  .row > span:first-child { color:var(--muted); }
  /* Valores de fader/ganho: caixa de texto com cara de texto, como o nome. */
  .val { display:flex; align-items:center; gap:3px; }
  .num-in { width:4.2em; padding:0 3px; font:inherit; color:var(--text); text-align:right; background:transparent;
    border:1px solid transparent; border-radius:3px; }
  .num-in:read-only { cursor:default; }
  body.writable .num-in:not(:read-only):hover { border-color:var(--line); }
  body.writable .num-in:focus { outline:none; border-color:var(--text); background:#0b0c0e; }
  .mute-tag { font:inherit; font-size:11px; font-weight:700; text-align:center; border-radius:3px; padding:1px;
    border:1px solid transparent; background:transparent; color:inherit; }
  .mute-tag.on { background:var(--mute); color:#fff; }
  .mute-tag.off { color:var(--muted); border-color:var(--line); }
  .mute-tag:disabled { cursor:default; }
  body.writable .mute-tag:not(:disabled) { cursor:pointer; }
  body.writable .mute-tag:not(:disabled):hover { filter:brightness(1.3); border-color:var(--text); }
  #ro-note { display:none; margin:12px 16px 0; padding:8px 12px; border:1px solid var(--yellow); border-radius:6px;
    color:var(--yellow); font-size:13px; }
  body:not(.writable) #ro-note { display:block; }
  #ro-note code { color:var(--text); }
  #dlg { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:10; }
  #dlg.open { display:flex; }
  #dlg .box { width:min(420px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:16px; display:flex; flex-direction:column; gap:12px; }
  #dlg h2 { margin:0; font-size:16px; }
  #dlg input { font:inherit; padding:6px 8px; color:var(--text); background:#0b0c0e; border:1px solid var(--line); border-radius:4px; }
  #dlg .cmd { font-family:ui-monospace, Menlo, monospace; font-size:13px; background:#0b0c0e; padding:8px; border-radius:4px;
    overflow-wrap:anywhere; }
  #dlg .err { font-size:13px; min-height:1em; }
  #dlg .note { font-size:13px; color:var(--yellow); }
  #dlg .note:empty { display:none; }
  #dlg .btns { display:flex; gap:8px; justify-content:flex-end; }
  #dlg button { font:inherit; padding:6px 14px; border-radius:4px; border:1px solid var(--line); background:#262a31; color:var(--text); cursor:pointer; }
  #dlg button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  #dlg button:disabled { opacity:.5; cursor:default; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); max-width:calc(100vw - 32px); padding:8px 14px;
    border-radius:6px; background:var(--panel); border:1px solid var(--line); display:none; z-index:11; }
  #toast.show { display:block; }
</style>
</head>
<body>
<header>
  <h1>WING Remote</h1>
  <span class="badge" id="host">—</span>
  <span class="badge" id="osc">OSC: —</span>
  <span class="badge" id="mtr">Medidores: —</span>
  <span class="badge ro" id="mode">Somente leitura</span>
  <span id="info" class="num"></span>
</header>
<div id="ro-note">Somente leitura: para renomear e mutar pela página, inicie com
  <code>CONSOLE_HOST=&lt;ip&gt; WING_ALLOW_WRITES=1 npm start</code></div>
<div id="grid"></div>
<div id="dlg" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="dlg-title"></h2>
    <input id="dlg-input" maxlength="16" autocomplete="off">
    <div>Comando que será enviado à mesa:</div>
    <div class="cmd" id="dlg-cmd"></div>
    <div class="note" id="dlg-note"></div>
    <div class="err" id="dlg-err"></div>
    <div class="btns">
      <button type="button" id="dlg-cancel">Cancelar</button>
      <button type="button" class="primary" id="dlg-ok">Enviar</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
  const grid = document.getElementById("grid");
  const cards = [];
  // Faixa do medidor: -60 dB .. 0 dB
  const pct = (db) => db == null ? 0 : Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
  const fmtNum = (v) => v == null ? "—" : v <= -144 ? "-∞" : v.toFixed(1);
  // Aceita "-3", "-3,5", "+2", "-inf", "-oo", "-∞".
  function parseDb(text) {
    const t = text.trim().toLowerCase().replace(",", ".").replace(/\s*db$/, "");
    if (["-∞", "-inf", "-oo", "-infinito"].includes(t)) return -144;
    if (!/^[+-]?\d+(\.\d+)?$/.test(t)) return NaN;
    return Number(t);
  }

  // Caixa numérica: Enter/sair confirma, Esc desfaz; não chega ao Enter da janela.
  // dataset.editing fica "1" do foco até a janela fechar; enquanto isso a tela não sobrescreve o valor.
  function bindNumberInput(input, currentText, onCommit) {
    input.addEventListener("focus", () => { if (!input.readOnly) { input.dataset.editing = "1"; input.select(); } });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); input.blur(); }
      if (e.key === "Escape") { input.value = currentText(); input.blur(); }
    });
    input.addEventListener("blur", () => {
      if (input.value !== currentText()) onCommit(input.value);
      else delete input.dataset.editing;
    });
  }
  function endEdit(input, text) {
    delete input.dataset.editing;
    input.value = text;
  }

  function card(i) {
    if (cards[i]) return cards[i];
    const el = document.createElement("div");
    el.className = "ch";
    el.innerHTML = `<div class="num">CH ${i + 1}</div>
      <input class="name" maxlength="16" placeholder="(sem nome)" spellcheck="false" autocomplete="off" readonly>
      <div class="meter"><div class="bar"></div><div class="bar"></div></div>
      <button type="button" class="mute-tag" disabled></button>
      <label class="row"><span>Fader</span><span class="val"><input class="num-in fdr" readonly autocomplete="off"> dB</span></label>
      <label class="row"><span>Ganho</span><span class="val"><input class="num-in gain" readonly autocomplete="off"> dB</span></label>`;
    grid.appendChild(el);
    const c = cards[i] = { el, name: el.querySelector(".name"), bars: el.querySelectorAll(".bar"),
      mute: el.querySelector(".mute-tag"), fdr: el.querySelector(".fdr"), gain: el.querySelector(".gain"),
      current: "", muted: null, faderDb: null, gainDb: null };
    c.mute.addEventListener("click", () => toggleMute(i + 1));
    c.fdr.value = c.gain.value = fmtNum(null);
    bindNumberInput(c.fdr, () => fmtNum(c.faderDb), (text) => setFader(i + 1, text));
    bindNumberInput(c.gain, () => fmtNum(c.gainDb), (text) => setGain(i + 1, text));
    // Edição do nome no próprio card: Enter confirma, Esc desfaz.
    c.name.addEventListener("keydown", (e) => {
      // stopPropagation: este Enter não pode chegar ao Enter da janela de confirmação.
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); c.name.blur(); }
      if (e.key === "Escape") { c.name.value = c.current; c.name.blur(); }
    });
    c.name.addEventListener("blur", () => {
      if (c.name.value !== c.current) rename(i + 1, c.name.value);
    });
    return c;
  }

  // Janela de confirmação dentro da página (não usa prompt/confirm do navegador,
  // que alguns navegadores bloqueiam sem avisar).
  const dlg = {
    root: document.getElementById("dlg"), title: document.getElementById("dlg-title"),
    input: document.getElementById("dlg-input"), cmd: document.getElementById("dlg-cmd"),
    note: document.getElementById("dlg-note"),
    err: document.getElementById("dlg-err"), ok: document.getElementById("dlg-ok"),
    cancel: document.getElementById("dlg-cancel"), action: null,
  };
  function openDialog({ title, input, buildCmd, send, onCancel, note }) {
    dlg.onCancel = onCancel || null;
    dlg.note.textContent = note || "";
    dlg.title.textContent = title;
    dlg.input.style.display = input == null ? "none" : "";
    dlg.input.value = input ?? "";
    dlg.err.textContent = "";
    dlg.ok.disabled = false;
    const refresh = () => {
      const r = buildCmd(dlg.input.value);
      dlg.cmd.textContent = r.cmd ?? "—";
      dlg.err.textContent = r.error ?? "";
      dlg.ok.disabled = !!r.error;
    };
    dlg.input.oninput = refresh;
    refresh();
    let busy = false;
    dlg.action = async () => {
      if (busy || dlg.ok.disabled) return; // um clique = uma escrita
      busy = true;
      dlg.ok.disabled = true;
      dlg.err.textContent = "Enviando…";
      const msg = await send(dlg.input.value);
      busy = false;
      if (msg) { dlg.err.textContent = msg; dlg.ok.disabled = false; return; }
      dlg.onCancel = null;
      closeDialog();
    };
    dlg.root.classList.add("open");
    if (input != null) { dlg.input.focus(); dlg.input.select(); } else dlg.ok.focus();
  }
  function closeDialog() {
    dlg.root.classList.remove("open");
    dlg.action = null;
    const cancel = dlg.onCancel;
    dlg.onCancel = null;
    if (cancel) cancel();
  }
  dlg.ok.addEventListener("click", () => dlg.action && dlg.action());
  dlg.cancel.addEventListener("click", closeDialog);
  dlg.root.addEventListener("click", (e) => { if (e.target === dlg.root) closeDialog(); });
  document.addEventListener("keydown", (e) => {
    if (!dlg.action) return;
    if (e.key === "Escape") closeDialog();
    if (e.key === "Enter") { e.preventDefault(); dlg.action(); }
  });

  let toastTimer = null;
  function toast(text, isError) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.className = "show " + (isError ? "err" : "ok");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = ""), 4000);
  }

  // Retorna null em caso de sucesso, ou a mensagem de erro.
  async function post(path, body, describeReadBack) {
    try {
      const res = await fetch(path, {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) return "Erro: " + data.error;
      if (!data.ok) return "A mesa não confirmou. Valor lido: " + describeReadBack(data.readBack);
      return null;
    } catch (e) {
      return "Falha: " + e.message;
    }
  }

  function toggleMute(ch) {
    if (!lastStatus || !lastStatus.writesEnabled) return;
    const current = cards[ch - 1].muted;
    if (current == null) return;
    const mute = !current;
    const label = cards[ch - 1].current || `CH ${ch}`;
    openDialog({
      title: `${mute ? "Mutar" : "Desmutar"} "${label}" (canal ${ch})?`,
      buildCmd: () => ({ cmd: `/ch/${ch}/mute ,i ${mute ? 1 : 0}` }),
      send: async () => {
        const err = await post(`/api/channels/${ch}/mute`, { mute }, (v) => (v ? "mutado" : "desmutado"));
        if (!err) toast(`Canal ${ch} ${mute ? "mutado" : "desmutado"}`);
        return err;
      },
    });
  }

  function rename(ch, name) {
    const c = cards[ch - 1];
    if (!lastStatus || !lastStatus.writesEnabled) { c.name.value = c.current; return; }
    const current = c.current;
    let error = null;
    if (name.length > 16) error = "Máximo de 16 caracteres.";
    else if (!/^[\x20-\x7e]*$/.test(name)) error = "Use só letras sem acento, números e símbolos.";
    openDialog({
      title: `Renomear canal ${ch}: ${JSON.stringify(current)} → ${JSON.stringify(name)}`,
      buildCmd: () => ({ cmd: `/ch/${ch}/name ,s ${JSON.stringify(name)}`, error }),
      send: async () => {
        const err = await post(`/api/channels/${ch}/name`, { name }, (v) => JSON.stringify(v));
        if (!err) toast(`Canal ${ch} renomeado para ${JSON.stringify(name)}`);
        return err;
      },
      // Cancelou: volta o texto da caixa para o nome que está na mesa.
      onCancel: () => { c.name.value = c.current; },
    });
  }

  const fmtSet = (v) => (v <= -144 ? "-∞" : (v > 0 ? "+" : "") + v.toFixed(1)) + " dB";

  function setFader(ch, text) {
    const c = cards[ch - 1];
    const revert = () => endEdit(c.fdr, fmtNum(c.faderDb));
    if (!lastStatus || !lastStatus.writesEnabled) return revert();
    const db = Math.round(parseDb(text) * 10) / 10;
    let error = null;
    if (Number.isNaN(db)) error = "Digite um número em dB (ex.: -5, 0, +3) ou -inf.";
    else if (db < -144 || db > 10) error = "O fader vai de -∞ (-144) até +10 dB.";
    const label = c.current || `CH ${ch}`;
    openDialog({
      title: `Fader "${label}" (canal ${ch}): ${fmtSet(c.faderDb ?? -144)} → ${error ? text : fmtSet(db)}`,
      buildCmd: () => ({ cmd: error ? "—" : `/ch/${ch}/fdr ,f ${db}`, error }),
      note: !error && db > (c.faderDb ?? -144) + 6 ? "Atenção: aumento de mais de 6 dB." : "",
      send: async () => {
        const err = await post(`/api/channels/${ch}/fader`, { db }, (v) => fmtSet(v));
        if (!err) { toast(`Fader do canal ${ch} em ${fmtSet(db)}`); revert(); }
        return err;
      },
      onCancel: revert,
    });
  }

  async function setGain(ch, text) {
    const c = cards[ch - 1];
    const revert = () => endEdit(c.gain, fmtNum(c.gainDb));
    if (!lastStatus || !lastStatus.writesEnabled) return revert();
    const db = Math.round(parseDb(text) * 10) / 10;
    let error = null;
    if (Number.isNaN(db)) error = "Digite um número em dB (ex.: 20, 32.5).";
    else if (db < -3 || db > 45.5) error = "O ganho vai de -3 até +45,5 dB.";
    // Lê (sem escrever) qual fonte alimenta o canal: o ganho é ajustado nela.
    let src = null;
    try {
      const res = await fetch(`/api/channels/${ch}/source`);
      src = await res.json();
      if (!res.ok) error = error || src.error;
      else if (!src.gainAddress) error = error || `Este canal usa a fonte ${src.grp} ${src.in}, que não tem ganho ajustável.`;
    } catch (e) {
      error = error || "Não foi possível ler a fonte do canal: " + e.message;
    }
    const label = c.current || `CH ${ch}`;
    const srcName = src && src.grp ? `${src.grp} ${src.in}${src.alt ? " (entrada alternativa)" : ""}` : "?";
    openDialog({
      title: `Ganho "${label}" (canal ${ch}): ${fmtSet(c.gainDb ?? 0)} → ${error ? text : fmtSet(db)}`,
      buildCmd: () => ({ cmd: error || !src ? "—" : `${src.gainAddress} ,f ${db}`, error }),
      note: error ? "" : `O ganho fica na fonte ${srcName}: muda em todos os canais que usam essa fonte.` +
        (db > (c.gainDb ?? 0) + 6 ? " Atenção: aumento de mais de 6 dB." : ""),
      send: async () => {
        const err = await post(`/api/channels/${ch}/gain`, { db }, (v) => fmtSet(v));
        if (!err) { toast(`Ganho do canal ${ch} (${srcName}) em ${fmtSet(db)}`); revert(); }
        return err;
      },
      onCancel: revert,
    });
  }

  function renderChannel(st) {
    const c = card(st.index - 1);
    // Não sobrescreve o texto enquanto a pessoa está editando ou confirmando.
    const editing = document.activeElement === c.name || c.name.value !== c.current;
    c.current = st.name;
    c.muted = st.mute;
    if (!editing) c.name.value = st.name;
    c.el.classList.toggle("muted", st.mute === true);
    c.mute.textContent = st.mute == null ? "—" : st.mute ? "MUTE" : "ativo";
    c.mute.className = "mute-tag " + (st.mute ? "on" : "off");
    // Mesma regra do nome: não sobrescreve um valor em edição.
    for (const [input, key] of [[c.fdr, "faderDb"], [c.gain, "gainDb"]]) {
      c[key] = st[key];
      if (!input.dataset.editing) input.value = fmtNum(st[key]);
    }
    updateButtons(c);
    if (st.meter) renderMeter(st.index - 1, st.meter);
  }

  function renderMeter(i, m) {
    const c = card(i);
    if (!m) return;
    // Medidor pós-processamento (saída do canal), L e R
    c.bars[0].style.setProperty("--h", pct(m.outL) + "%");
    c.bars[1].style.setProperty("--h", pct(m.outR) + "%");
  }

  function updateButtons(c) {
    const writable = !!(lastStatus && lastStatus.writesEnabled);
    c.name.readOnly = !writable;
    c.fdr.readOnly = !writable || c.faderDb == null;
    c.gain.readOnly = !writable || c.gainDb == null;
    c.mute.disabled = !writable || c.muted == null;
    c.name.title = writable ? "Clique para renomear" : "";
    c.mute.title = writable ? (c.muted ? "Clique para desmutar" : "Clique para mutar") : "";
  }

  function renderStatus(s) {
    document.getElementById("host").textContent = "Mesa: " + s.host;
    const wasWritable = document.body.classList.contains("writable");
    document.body.classList.toggle("writable", !!s.writesEnabled);
    if (wasWritable !== !!s.writesEnabled) cards.forEach((c) => c && updateButtons(c));
    const mode = document.getElementById("mode");
    mode.textContent = s.writesEnabled ? "Escrita liberada" : "Somente leitura";
    mode.className = "badge " + (s.writesEnabled ? "rw" : "ro");
    const now = Date.now();
    const osc = document.getElementById("osc");
    const oscOk = s.lastOscAt && now - s.lastOscAt < 15000;
    osc.textContent = "OSC: " + (oscOk ? "conectado" : "sem resposta");
    osc.className = "badge " + (oscOk ? "ok" : "err");
    const mtr = document.getElementById("mtr");
    const mOk = s.lastMeterAt && now - s.lastMeterAt < 5000;
    mtr.textContent = "Medidores: " + (mOk ? "recebendo" : "sem dados");
    mtr.className = "badge " + (mOk ? "ok" : "err");
    document.getElementById("info").textContent = (s.consoleInfo || "") + (s.error ? " · " + s.error : "");
  }

  let lastStatus = null;
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => {
    const { status, channels } = JSON.parse(e.data);
    lastStatus = status;
    channels.forEach(renderChannel);
    renderStatus(status);
  });
  es.addEventListener("channel", (e) => renderChannel(JSON.parse(e.data)));
  es.addEventListener("status", (e) => { lastStatus = JSON.parse(e.data); renderStatus(lastStatus); });
  es.addEventListener("meters", (e) => {
    JSON.parse(e.data).forEach((m, i) => renderMeter(i, m));
    if (lastStatus) { lastStatus.lastMeterAt = Date.now(); renderStatus(lastStatus); }
  });
  setInterval(async () => {
    try { lastStatus = (await (await fetch("/api/state")).json()).status; renderStatus(lastStatus); } catch {}
  }, 3000);
</script>
</body>
</html>
